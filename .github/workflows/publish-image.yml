name: Publish image

# Compila a imagem do site novo (React + FastAPI) para ARM64 e publica no GHCR.
# So roda quando algo do site novo muda, para nao competir com o deploy do MkDocs.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/publish-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/armandonettox/portfolio

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # a VM da Oracle (A1.Flex) e ARM64; o QEMU deixa o runner x86 compilar para ela
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
