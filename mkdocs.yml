site_name: Armando Netto
site_url: https://armandonetto.com/
site_description: Armando Netto - Profissional de Dados.
site_author: Armando Netto

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font: false
  favicon: assets/favicon.png
  logo: assets/logo.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - header.autohide
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: an-light
      toggle:
        icon: material/weather-sunny
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: an-dark
      toggle:
        icon: material/weather-night
        name: Modo claro

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      blog_toc: true
      categories_allowed:
        - Projetos
        - Workflow
        - Bastidores

extra_css:
  - stylesheets/extra.css?v=20260729n

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Projetos:
      - Visão geral: projetos/index.md
      - Verbo:
          - Visão geral: projetos/verbo/index.md
          - Primeiros passos:
              - Instalação: projetos/verbo/getting-started/installation.md
              - Configuração: projetos/verbo/getting-started/configuration.md
              - Rodando: projetos/verbo/getting-started/running.md
          - Referência:
              - Arquitetura: projetos/verbo/reference/architecture.md
              - Adaptação: projetos/verbo/reference/adaptation.md
              - Erros comuns: projetos/verbo/reference/troubleshooting.md
  - Blog: blog/index.md
